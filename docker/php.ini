; Réglages PHP de production de RiverLog (complètent php.ini-production)

; Ne pas annoncer la version de PHP dans les en-têtes
expose_php = Off

; Limites d'envoi pour la page Import : un fichier de 10 Mo maximum par requête,
; la page envoie les fichiers un par un (mêmes valeurs que public/.user.ini en local)
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 60

; Les fichiers PHP ne changent pas dans l'image : pas besoin de les revérifier
opcache.validate_timestamps = 0
