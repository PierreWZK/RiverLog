# ---------------------------------------------------------------------------
# RiverLog · intégration continue
#
# À chaque push et pull request, les tests tournent sur PHP 8.3 + MySQL 8.4.
# Le déploiement est fait par Coolify à chaque push sur master.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP 8.3 · MySQL 8.4)
    runs-on: ubuntu-latest

    # Base MySQL temporaire, identique au moteur de production
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: riverlog_test
          MYSQL_USER: riverlog
          MYSQL_PASSWORD: riverlog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: riverlog_test
      DB_USERNAME: riverlog
      DB_PASSWORD: riverlog

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, fileinfo
          coverage: none

      - name: Dépendances Composer (avec cache)
        uses: ramsey/composer-install@v3

      - name: Configuration Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test

